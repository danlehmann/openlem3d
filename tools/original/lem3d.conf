# DOSBox-X base configuration for running the original Lemmings 3D.
# launch.ps1 loads this file and then a generated second config holding the
# machine-specific paths ([autoexec] mounts, capture folder).

[sdl]
fullscreen        = false
output            = direct3d
windowresolution  = 1280x960
windowposition    = 40,40
autolock          = false
autolock_feedback = none
mouse_emulation   = always
showmenu          = false
showbasic         = true
waitonerror       = false
priority          = higher,normal

[dosbox]
title             = openlem3d-original
machine           = svga_s3
memsize           = 16
startbanner       = false
quit warning      = false
fastbioslogo      = true
# Clean-room rule: the debugger MCP server stays disabled.
mcp_server        = 0

[render]
aspect            = true

[cpu]
core              = dynamic
cputype           = pentium
cycles            = max

[mixer]
rate              = 44100
blocksize         = 1024

[sblaster]
sbtype            = sb16
sbbase            = 220
irq               = 5
dma               = 1
hdma              = 5
oplmode           = auto

[midi]
mpu401            = intelligent
mididevice        = default

[speaker]
pcspeaker         = true

[dos]
xms               = true
ems               = true
umb               = true
