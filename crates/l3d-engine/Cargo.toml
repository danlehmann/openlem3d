[package]
name = "l3d-engine"
description = "The few engine pieces openlem3d needs: a window, input, time, states, assets and sound around an ECS"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# The ECS the game's systems run in, on one thread.
bevy_ecs = { version = "0.19.1", default-features = false, features = ["std"] }
glam = "0.32"
log = { version = "0.4", features = ["std"] }
rodio = { version = "0.22", default-features = false, features = ["playback"] }
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-csd-adwaita"] }

[target.'cfg(target_os = "android")'.dependencies]
winit = { version = "0.30.13", default-features = false, features = ["android-native-activity"] }
