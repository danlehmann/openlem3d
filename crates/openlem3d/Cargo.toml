[package]
name = "openlem3d"
description = "Open-source reimplementation of Lemmings 3D"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
l3d-formats.workspace = true
# Only what the game uses: it draws the scene with its own wgpu renderer
# (no 3D/PBR, sprites, glTF or scenes), shows no text, and plays WAV sounds.
bevy = { version = "0.19.1", default-features = false, features = [
    "default_app",
    "std",
    "multi_threaded",
    "bevy_winit",
    "x11",
    "wayland",
    "custom_cursor",
    "ui_bevy_render",
    "bevy_picking",
    "ui_picking",
    "bevy_audio",
    "wav",
] }
wgpu = "29.0.4"
l3d-sim.workspace = true
