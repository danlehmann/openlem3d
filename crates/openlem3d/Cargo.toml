[package]
name = "openlem3d"
description = "Open-source reimplementation of Lemmings 3D"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
l3d-formats.workspace = true
l3d-engine.workspace = true
# The ECS the game's systems run in (l3d-engine's); its derives name it.
bevy_ecs = { version = "0.19.1", default-features = false, features = ["std"] }
# Waits for wgpu's adapter and device.
pollster = "0.4"
# Saves --screenshot images.
png.workspace = true
wgpu = "29.0.4"
l3d-sim.workspace = true

[target.'cfg(windows)'.dependencies]
# Precision touchpad fingers (`src/trackpad.rs`); the version winit uses.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Input",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# Trackpad fingers (`src/trackpad.rs`); the versions wgpu uses.
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "NSApplication",
    "NSEvent",
    "NSResponder",
    "NSTouch",
    "NSView",
    "NSWindow",
] }

[target.'cfg(target_os = "android")'.dependencies]
# For the window insets (`src/platform.rs`); the version the sound output (cpal) uses.
jni = "0.21"
