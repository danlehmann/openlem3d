[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.99"

[workspace.dependencies]
l3d-formats = { path = "crates/l3d-formats" }
l3d-sim = { path = "crates/l3d-sim" }
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
png = "0.17"

# Bevy is unusably slow without optimisation; keep our own crates quick to build.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
