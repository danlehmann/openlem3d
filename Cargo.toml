[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.99"

[workspace.dependencies]
l3d-formats = { path = "crates/l3d-formats" }
l3d-sim = { path = "crates/l3d-sim" }
l3d-engine = { path = "crates/l3d-engine" }
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
png = "0.17"

# Bevy is unusably slow without optimisation; keep our own crates quick to build.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# winit 0.30 turns Android mouse events into touches, losing the buttons; this
# copy handles them as mouse events (`patches/winit/README.openlem3d.md`).
[patch.crates-io]
winit = { path = "patches/winit" }
